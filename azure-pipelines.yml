trigger:
  branches:
    include:
      - develop
      - main

variables:
  - name: NODE_VERSION
    value: "18.x"
  - group: VianaHubSecrets

stages:
  - stage: BuildAndDeploy
    displayName: "Build and Conditional Deploy"
    jobs:
      - job: Build
        displayName: "Build Job"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(NODE_VERSION)"
            displayName: "Install Node.js"

          - script: npm install -g pnpm
            displayName: "Install pnpm"

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: "Cache pnpm dependencies"

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: "Install dependencies with pnpm"

          - script: |
              pnpm run build
            displayName: "Build project"

          # Publica a pasta 'out' como artefato
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: out
              artifact: build_output
            displayName: "Publish build artifact"

      # Deploy para DEV (apenas na branch develop)
      - job: DeployDEV
        displayName: "Deploy to DEV"
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: build_output
              path: $(Pipeline.Workspace)

          - task: AzureStaticWebApp@0
            inputs:
              app_location: "$(Pipeline.Workspace)/out"
              output_location: ""
              azure_static_web_apps_api_token: "$(DEPLOYMENT_TOKEN_VH_DEV)"
            displayName: "Deploy to DEV"

      # Deploy para PRD (apenas na branch main, com aprovação no ambiente)
      - deployment: DeployPRD
        displayName: "Deploy to PRD"
        dependsOn: Build
        condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
        environment: "PRD" # <- Configure aprovação no DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: build_output
                    path: $(Pipeline.Workspace)

                - task: AzureStaticWebApp@0
                  inputs:
                    app_location: "$(Pipeline.Workspace)/out"
                    output_location: ""
                    azure_static_web_apps_api_token: "$(DEPLOYMENT_TOKEN_VH_PRD)"
                  displayName: "Deploy to PRD"
