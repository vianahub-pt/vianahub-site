trigger:
  branches:
    include:
      - develop
      - main

variables:
  - name: NODE_VERSION
    value: "18.x"
  - group: VianaHubSecrets

stages:
  # Stage 1: Build
  - stage: Build
    displayName: "Build"
    jobs:
      - job: BuildJob
        displayName: "Build Job"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "$(NODE_VERSION)"
            displayName: "Install Node.js"

          - script: npm install -g pnpm
            displayName: "Install pnpm"

          - task: Cache@2
            inputs:
              key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
              restoreKeys: |
                pnpm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.pnpm-store
            displayName: "Cache pnpm dependencies"

          - script: |
              pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
              pnpm install --frozen-lockfile
            displayName: "Install dependencies with pnpm"

          - script: |
              pnpm run build
            displayName: "Build project (next build && next export)"

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Pipeline.Workspace)/out
              artifact: build_output
            displayName: "Publish build artifact"

  # Stage 2: Deploy to DEV (branch develop)
  - stage: Deploy_DEV
    displayName: "Deploy to DEV"
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'develop'))
    jobs:
      - job: DeployToDev
        displayName: "Deploy to DEV"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: build_output
              path: $(Pipeline.Workspace)/build_output

          - task: AzureStaticWebApp@0
            inputs:
              app_location: "$(Pipeline.Workspace)/build_output/out"
              output_location: ""
              azure_static_web_apps_api_token: "$(DEPLOYMENT_TOKEN_VH_DEV)"
            displayName: "Deploy to DEV"

  # Stage 3: Deploy to PRD (branch main, após DEV)
  - stage: Deploy_PRD
    displayName: "Deploy to PRD"
    dependsOn: Deploy_DEV
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
    jobs:
      - deployment: DeployToPrd
        displayName: "Deploy to PRD"
        environment: "PRD" # <- Configure com aprovadores no DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: build_output
                    path: $(Pipeline.Workspace)/build_output

                - task: AzureStaticWebApp@0
                  inputs:
                    app_location: "$(Pipeline.Workspace)/build_output/out"
                    output_location: ""
                    azure_static_web_apps_api_token: "$(DEPLOYMENT_TOKEN_VH_PRD)"
                  displayName: "Deploy to PRD"
